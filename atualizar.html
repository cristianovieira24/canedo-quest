<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Canedo Quest</title><style>body{font-family:system-ui;background:#07111f;color:#edf4ff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}main{max-width:520px;padding:30px}button{padding:12px 18px;border-radius:10px;border:1px solid #35516f;background:#12304a;color:white;font-weight:700;cursor:pointer}</style></head><body><main><h1>Atualizando o Canedo Quest…</h1><p>Esta página remove versões antigas em cache e abre a versão nova.</p></main><script>(async function(){try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister();}));}if("caches" in window){const ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}}finally{location.replace("./?v=20");}})();</script></body></html>
